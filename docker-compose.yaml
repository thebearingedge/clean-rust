services:

  postgres:
    image: docker.io/postgres:18.6-alpine3.24
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: --nosync
    tmpfs: /var/lib/postgresql
    volumes:
      - ./services/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres -d postgres || exit 1
      interval: 1s
      start_period: 5s

  opentelemetry-collector:
    image: docker.io/otel/opentelemetry-collector:0.162.0
    command: [--config=/etc/opentelemetry-collector/config.yaml]
    volumes:
      - ./services/opentelemetry-collector/config.yaml:/etc/opentelemetry-collector/config.yaml:ro
    ports:
      - 4317:4317
      - 4318:4318
