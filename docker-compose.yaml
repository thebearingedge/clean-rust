services:

  postgres:
    image: docker.io/postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U app -d app || exit 1
      interval: 5s
      start_period: 5s

volumes:
  pg_data: 
  