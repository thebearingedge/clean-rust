services:

  postgres:
    image: docker.io/postgres:18.6-alpine3.24
    command: [
      postgres,
      -c, fsync=off,
      -c, synchronous_commit=off,
      -c, full_page_writes=off,
      -c, wal_level=minimal,
      -c, max_wal_senders=0,
      -c, max_wal_size=1GB,
      -c, autovacuum=off,
      -c, work_mem=32MB,
      -c, shared_buffers=256MB
    ]
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: --nosync
    tmpfs: /var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres -d postgres || exit 1
      interval: 1s
      start_period: 5s
