[workspace]
resolver = "3"
members = ["apps/*/*", "domains/*", "libs/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
database = { path = "libs/database" }
telemetry = { path = "libs/telemetry" }
todos = { path = "domains/todos" }
storage = { path = "libs/storage" }
util = { path = "libs/util" }
web = { path = "libs/web" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
claims = "0.8"
http-body-util = "0.1.5"
jsonschema = "0.58.6"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = [
  "grpc-tonic",
  "trace",
  "logs",
] }
opentelemetry-appender-tracing = "0.33.1"
schemars = { version = "1.2.2", features = [
  "uuid1",
  "chrono04",
  "rust_decimal1",
] }
serde = { version = "1.0.229" }
serde-json-assert = "0.4.0"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.28.0", features = ["serde", "v7"] }
